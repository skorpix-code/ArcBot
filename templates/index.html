<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArcBot</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            primary: {
                                DEFAULT:
                                    "rgb(var(--primary-rgb) / <alpha-value>)",
                                hover: "rgb(var(--primary-hover-rgb) / <alpha-value>)",
                            },
                        },
                    },
                },
            };
        </script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --primary-rgb: 99 102 241; /* #6366f1 */
                --primary-hover-rgb: 79 70 229; /* #4f46e5 */
            }
            body {
                background-color: #09090b;
                color: #e4e4e7;
            }
            .glass {
                background: rgba(24, 24, 27, 0.7);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            .prose pre {
                background: #18181b;
                padding: 10px;
                border-radius: 6px;
                overflow-x: auto;
            }
            .prose code {
                color: #a1a1aa;
                font-family: "JetBrains Mono";
                font-size: 0.9em;
            }
            .thinking-box {
                background: rgba(var(--primary-rgb), 0.05);
                border-left: 2px solid rgb(var(--primary-rgb));
            }
            .disintegrate {
                animation: snap 1s ease-out forwards;
            }
            @keyframes snap {
                0% {
                    opacity: 1;
                    filter: blur(0);
                    transform: scale(1);
                }
                100% {
                    opacity: 0;
                    filter: blur(8px) grayscale(100%);
                    transform: scale(1.05) translateX(10px) translateY(-10px);
                }
            }
            input[type="color"] {
                -webkit-appearance: none;
                border: none;
                width: 100%;
                height: 100%;
                border-radius: 50%;
                overflow: hidden;
                cursor: pointer;
            }
            input[type="color"]::-webkit-color-swatch-wrapper {
                padding: 0;
            }
            input[type="color"]::-webkit-color-swatch {
                border: none;
            }

            /* Terminal Transition */
            .terminal-pane {
                transition:
                    width 0.3s ease-in-out,
                    opacity 0.3s ease-in-out;
            }
        </style>
    </head>
    <body
        class="h-screen flex flex-col font-sans overflow-hidden selection:bg-primary/30"
    >
        <div
            x-data="app()"
            x-init="connect()"
            class="h-full flex flex-col relative"
        >
            <div
                x-show="!configured"
                x-transition.opacity
                class="absolute inset-0 z-50 bg-[#09090b] flex items-center justify-center p-4"
            >
                <div
                    class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl border border-zinc-800"
                >
                    <div class="mb-8 text-center">
                        <div
                            class="w-12 h-12 bg-primary rounded-xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-primary/30"
                        >
                            <svg
                                class="w-6 h-6 text-white"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                                />
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                                />
                            </svg>
                        </div>
                        <h2 class="text-xl font-semibold text-white">
                            Agent Configuration
                        </h2>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label
                                class="block text-xs font-medium text-zinc-400 mb-1"
                                >Provider</label
                            >
                            <select
                                x-model="config.provider"
                                @change="updateModelDefault()"
                                class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-primary focus:outline-none"
                            >
                                <option value="LM Studio">LM Studio</option>
                                <option value="Ollama">Ollama</option>
                                <option value="Google Gemini">
                                    Google Gemini
                                </option>
                                <option value="OpenAI">OpenAI</option>
                            </select>
                        </div>
                        <div
                            x-show="config.provider !== 'Ollama' && config.provider !== 'LM Studio'"
                        >
                            <label
                                class="block text-xs font-medium text-zinc-400 mb-1"
                                >API Key</label
                            >
                            <input
                                type="password"
                                x-model="config.apiKey"
                                class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-primary focus:outline-none"
                                placeholder="sk-..."
                            />
                        </div>
                        <div>
                            <label
                                class="block text-xs font-medium text-zinc-400 mb-1"
                                >Model Name</label
                            >
                            <input
                                type="text"
                                x-model="config.model"
                                class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-primary focus:outline-none"
                            />
                        </div>
                        <button
                            @click="submitConfig"
                            class="w-full bg-primary hover:bg-primary-hover text-white py-2 rounded-lg font-medium transition-colors shadow-lg shadow-primary/20 mt-2"
                        >
                            Initialize System
                        </button>
                    </div>
                </div>
            </div>

            <div
                x-show="themeModal.open"
                x-transition.opacity
                class="absolute inset-0 z-[70] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
                style="display: none"
                @click.self="themeModal.open = false"
            >
                <div
                    class="glass w-full max-w-md rounded-2xl shadow-2xl border border-zinc-800 overflow-hidden flex flex-col"
                >
                    <div
                        class="p-4 border-b border-white/5 flex items-center justify-between"
                    >
                        <h3 class="text-white font-medium">Appearance</h3>
                        <button
                            @click="themeModal.open = false"
                            class="text-zinc-500 hover:text-white transition-colors"
                        >
                            <svg
                                class="w-5 h-5"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="flex border-b border-white/5">
                        <button
                            @click="themeModal.tab = 'presets'"
                            class="flex-1 py-3 text-sm font-medium transition-colors relative"
                            :class="themeModal.tab === 'presets' ? 'text-white' : 'text-zinc-500 hover:text-zinc-300'"
                        >
                            Presets
                            <div
                                x-show="themeModal.tab === 'presets'"
                                class="absolute bottom-0 left-0 w-full h-0.5 bg-primary"
                                x-transition
                            ></div>
                        </button>
                        <button
                            @click="themeModal.tab = 'custom'"
                            class="flex-1 py-3 text-sm font-medium transition-colors relative"
                            :class="themeModal.tab === 'custom' ? 'text-white' : 'text-zinc-500 hover:text-zinc-300'"
                        >
                            Custom
                            <div
                                x-show="themeModal.tab === 'custom'"
                                class="absolute bottom-0 left-0 w-full h-0.5 bg-primary"
                                x-transition
                            ></div>
                        </button>
                    </div>
                    <div class="p-6">
                        <div
                            x-show="themeModal.tab === 'presets'"
                            class="grid grid-cols-4 gap-4"
                        >
                            <template
                                x-for="preset in themeModal.presets"
                                :key="preset.hex"
                            >
                                <button
                                    @click="applyTheme(preset.hex)"
                                    class="flex flex-col items-center gap-2 group"
                                >
                                    <div
                                        class="w-12 h-12 rounded-full shadow-lg transition-transform group-hover:scale-110 border-2"
                                        :class="themeModal.currentHex === preset.hex ? 'border-white' : 'border-transparent'"
                                        :style="`background-color: ${preset.hex}`"
                                    ></div>
                                    <span
                                        class="text-xs text-zinc-400 group-hover:text-white transition-colors"
                                        x-text="preset.name"
                                    ></span>
                                </button>
                            </template>
                        </div>
                        <div
                            x-show="themeModal.tab === 'custom'"
                            class="space-y-6"
                        >
                            <div class="flex items-center gap-6">
                                <div
                                    class="relative w-24 h-24 rounded-full shadow-xl ring-2 ring-white/10 overflow-hidden shrink-0"
                                >
                                    <input
                                        type="color"
                                        x-model="themeModal.tempHex"
                                        @input="updateCustomFromPicker($event.target.value)"
                                        class="absolute inset-0 w-[150%] h-[150%] -top-1/4 -left-1/4 p-0 m-0 cursor-pointer"
                                    />
                                </div>
                                <div class="flex-1 space-y-1">
                                    <div
                                        class="text-xs text-zinc-500 uppercase tracking-wider font-bold"
                                    >
                                        Selected Color
                                    </div>
                                    <div
                                        class="text-2xl font-mono text-white"
                                        x-text="themeModal.tempHex"
                                    ></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div
                x-show="dirModal.open"
                x-transition.opacity
                class="absolute inset-0 z-[80] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
                style="display: none"
                @click.self="dirModal.open = false"
            >
                <div
                    class="glass w-full max-w-lg p-6 rounded-2xl shadow-2xl border border-zinc-800"
                >
                    <h3 class="text-lg font-bold text-white mb-2">
                        Change Directory Access
                    </h3>
                    <div class="mb-4">
                        <input
                            type="text"
                            x-model="dirModal.path"
                            placeholder="/home/username/projects"
                            class="flex-1 w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white font-mono focus:ring-2 focus:ring-primary focus:outline-none"
                        />
                    </div>
                    <div class="flex justify-end gap-3">
                        <button
                            @click="dirModal.open = false"
                            class="px-4 py-2 text-sm text-zinc-400 hover:text-white transition-colors"
                        >
                            Cancel
                        </button>
                        <button
                            @click="updateDirectory()"
                            class="bg-primary hover:bg-primary-hover text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors"
                        >
                            Update & Restart
                        </button>
                    </div>
                </div>
            </div>

            <div
                x-show="approval.pending"
                x-transition.opacity
                class="absolute inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
                style="display: none"
            >
                <div
                    class="glass w-full max-w-lg p-6 rounded-2xl shadow-2xl border border-red-500/50 relative overflow-hidden"
                >
                    <div
                        class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-500 via-orange-500 to-red-500 animate-pulse"
                    ></div>
                    <div class="flex items-start gap-4 mb-4">
                        <div
                            class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center shrink-0 border border-red-500/30"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-5 h-5 text-red-400"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                                />
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-white">
                                Execution Approval Required
                            </h3>
                            <p class="text-zinc-400 text-sm mt-1">
                                The agent wants to execute a command on your
                                system.
                            </p>
                        </div>
                    </div>
                    <div
                        class="bg-black/50 rounded-lg p-4 font-mono text-sm border border-zinc-800 mb-6 overflow-x-auto"
                    >
                        <code
                            class="text-yellow-400"
                            x-text="approval.command"
                        ></code>
                    </div>
                    <div class="flex gap-3">
                        <button
                            @click="sendApproval(false)"
                            class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white py-2.5 rounded-lg font-medium transition-colors border border-zinc-700"
                        >
                            Deny
                        </button>
                        <button
                            @click="sendApproval(true)"
                            class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-lg font-medium transition-colors shadow-lg shadow-red-900/20"
                        >
                            Allow Execution
                        </button>
                    </div>
                </div>
            </div>

            <header
                class="h-14 glass flex items-center justify-between px-6 z-20 shrink-0"
            >
                <div class="flex items-center gap-3">
                    <div
                        class="w-2.5 h-2.5 rounded-full bg-primary animate-pulse shadow-lg shadow-primary/50"
                    ></div>
                    <h1
                        class="font-semibold text-sm tracking-widest text-zinc-400"
                    >
                        ARC <span class="text-primary font-bold">BOT</span>
                    </h1>
                </div>

                <div
                    x-show="globalStatus && globalStatus !== 'Ready'"
                    x-transition
                    class="absolute left-1/2 -translate-x-1/2 top-4 bg-primary/10 border border-primary/20 px-4 py-1 rounded-full flex items-center gap-2"
                >
                    <div
                        class="w-1.5 h-1.5 bg-primary rounded-full animate-pulse"
                    ></div>
                    <span
                        class="text-[10px] font-mono text-primary uppercase tracking-wider opacity-80"
                        x-text="globalStatus"
                    ></span>
                </div>

                <div class="flex items-center gap-4">
                    <button
                        @click="toggleTerminal()"
                        class="p-2 text-zinc-400 hover:text-white transition-colors rounded-full hover:bg-white/5 relative"
                        title="Toggle Terminal"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <polyline points="4 17 10 11 4 5"></polyline>
                            <line x1="12" y1="19" x2="20" y2="19"></line>
                        </svg>
                        <div
                            x-show="terminalOpen"
                            class="absolute top-2 right-2 w-1.5 h-1.5 bg-green-500 rounded-full border border-[#18181b]"
                        ></div>
                    </button>

                    <div
                        class="text-[10px] font-mono text-zinc-500 uppercase hidden md:block"
                        x-text="config.model"
                    ></div>

                    <div class="relative" x-data="{ open: false }">
                        <button
                            @click="open = !open"
                            @click.outside="open = false"
                            class="p-2 text-zinc-400 hover:text-white transition-colors rounded-full hover:bg-white/5"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                                />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                        <div
                            x-show="open"
                            x-transition
                            class="absolute right-0 mt-2 w-48 bg-[#18181b] rounded-lg shadow-xl border border-zinc-800 z-50 overflow-hidden"
                        >
                            <div class="py-1">
                                <button
                                    @click="triggerReset(); open = false"
                                    class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-white/5 flex items-center gap-2 group"
                                >
                                    <svg
                                        class="w-4 h-4"
                                        xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <path
                                            d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"
                                        />
                                        <path d="M3 3v5h5" />
                                    </svg>
                                    Reset Chat
                                </button>
                                <button
                                    @click="dirModal.open = true; open = false"
                                    class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 flex items-center gap-2"
                                >
                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        class="w-4 h-4"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <path
                                            d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
                                        />
                                    </svg>
                                    Change Directory
                                </button>
                                <button
                                    @click="themeModal.open = true; open = false"
                                    class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 flex items-center gap-2"
                                >
                                    <svg
                                        class="w-4 h-4"
                                        xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line
                                            x1="14.31"
                                            y1="8"
                                            x2="20.05"
                                            y2="17.94"
                                        ></line>
                                        <line
                                            x1="9.69"
                                            y1="8"
                                            x2="21.17"
                                            y2="8"
                                        ></line>
                                        <line
                                            x1="7.38"
                                            y1="12"
                                            x2="13.12"
                                            y2="2.06"
                                        ></line>
                                        <line
                                            x1="9.69"
                                            y1="16"
                                            x2="3.95"
                                            y2="6.06"
                                        ></line>
                                        <line
                                            x1="14.31"
                                            y1="16"
                                            x2="2.83"
                                            y2="16"
                                        ></line>
                                        <line
                                            x1="16.62"
                                            y1="12"
                                            x2="10.88"
                                            y2="21.94"
                                        ></line>
                                    </svg>
                                    Themes
                                </button>
                                <button
                                    @click="switchProvider(); open = false"
                                    class="w-full text-left px-4 py-2 text-sm text-zinc-300 hover:bg-white/5 flex items-center gap-2"
                                >
                                    <svg
                                        class="w-4 h-4"
                                        xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <rect
                                            width="20"
                                            height="14"
                                            x="2"
                                            y="3"
                                            rx="2"
                                        />
                                        <line x1="8" x2="16" y1="21" y2="21" />
                                        <line x1="12" x2="12" y1="17" y2="21" />
                                    </svg>
                                    Switch Provider
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="flex-1 flex overflow-hidden">
                <main
                    class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth transition-all duration-300"
                    id="chat-box"
                >
                    <div
                        x-show="msgs.length === 0"
                        class="h-full flex flex-col items-center justify-center text-center p-8 opacity-50 select-none"
                    >
                        <div
                            class="w-16 h-16 bg-zinc-800 rounded-2xl flex items-center justify-center mb-6"
                        >
                            <svg
                                class="w-8 h-8 text-zinc-500"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="1.5"
                                    d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
                                />
                            </svg>
                        </div>
                        <h3 class="text-xl font-medium text-white mb-2">
                            Welcome to ArcBot
                        </h3>
                        <p class="text-zinc-500 max-w-sm mx-auto">
                            I can help you execute tasks, analyze files, and run
                            commands. Start by typing a request below.
                        </p>
                    </div>

                    <template x-for="msg in msgs" :key="msg.id">
                        <div
                            class="max-w-4xl mx-auto w-full group transition-all"
                            :class="{'disintegrate': msg.snapped}"
                        >
                            <div
                                x-show="msg.role === 'user'"
                                class="flex justify-end mb-4"
                            >
                                <div
                                    class="bg-zinc-800 border border-zinc-700 px-4 py-2 rounded-2xl rounded-tr-sm text-sm text-zinc-200 shadow-md"
                                >
                                    <span x-text="msg.text"></span>
                                </div>
                            </div>
                            <div
                                x-show="msg.role === 'assistant'"
                                class="flex gap-4 mb-8"
                            >
                                <div
                                    class="w-8 h-8 rounded bg-primary/10 border border-primary/20 flex items-center justify-center shrink-0 text-primary text-xs font-bold"
                                >
                                    AI
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div
                                        x-show="msg.thought"
                                        x-data="{open:true}"
                                        class="mb-2"
                                    >
                                        <button
                                            @click="open=!open"
                                            class="text-[10px] font-mono text-primary uppercase tracking-widest flex items-center gap-2 hover:opacity-80 transition-opacity"
                                        >
                                            <span
                                                class="w-1.5 h-1.5 bg-primary rounded-full animate-pulse"
                                            ></span
                                            >Reasoning
                                        </button>
                                        <div
                                            x-show="open"
                                            x-collapse
                                            class="thinking-box p-3 rounded mt-1 text-xs text-zinc-400 font-mono"
                                        >
                                            <div
                                                x-html="parse(msg.thought)"
                                            ></div>
                                        </div>
                                    </div>
                                    <div
                                        x-show="msg.status && !msg.text"
                                        class="flex items-center gap-2 text-xs font-mono text-zinc-500 animate-pulse bg-zinc-900/50 w-fit px-2 py-1 rounded"
                                    >
                                        <div
                                            class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce"
                                        ></div>
                                        <span x-text="msg.status"></span>
                                    </div>
                                    <div
                                        x-show="msg.text"
                                        class="prose prose-invert prose-sm text-zinc-300 font-light leading-relaxed"
                                        x-html="parse(msg.text)"
                                    ></div>
                                </div>
                            </div>
                        </div>
                    </template>
                    <div class="h-12"></div>
                </main>

                <div
                    class="terminal-pane flex flex-col border-l border-zinc-800 bg-[#000]"
                    :class="terminalOpen ? 'w-1/2 opacity-100' : 'w-0 opacity-0 overflow-hidden'"
                >
                    <div
                        class="flex items-center justify-between p-2 bg-[#18181b] border-b border-zinc-800 h-10 shrink-0"
                    >
                        <span
                            class="text-xs font-mono text-zinc-400 uppercase tracking-wider pl-2"
                            >Terminal Output</span
                        >
                        <button
                            @click="terminalOpen = false"
                            class="text-zinc-500 hover:text-white"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div
                        id="terminal-container"
                        class="flex-1 w-full bg-black p-1 overflow-hidden"
                    ></div>
                </div>
            </div>

            <footer class="p-6 pt-0 z-30">
                <div class="max-w-4xl mx-auto glass rounded-xl p-2 shadow-2xl">
                    <form
                        onsubmit="return false;"
                        class="flex gap-2 bg-[#0b0b0e] rounded-lg p-1"
                    >
                        <input
                            type="text"
                            id="user-input"
                            class="w-full bg-transparent border-none text-sm px-4 text-zinc-200 focus:outline-none font-sans placeholder-zinc-700"
                            placeholder="Type a message..."
                            autocomplete="off"
                            @keydown.enter.prevent="$el.closest('form').querySelector('button').click()"
                        />
                        <button
                            type="button"
                            onclick="window.sendMsg()"
                            class="bg-primary hover:bg-primary-hover text-white px-4 py-2 rounded-md text-xs font-bold transition-colors"
                        >
                            SEND
                        </button>
                    </form>
                </div>
            </footer>
        </div>

        <script>
            window.sendMsg = function () {
                const el = document.getElementById("user-input");
                const text = el.value.trim();
                if (!text || !window.chatApp) return;
                window.chatApp.send(text);
                el.value = "";
            };

            function app() {
                return {
                    configured: false,
                    globalStatus: "",
                    terminalOpen: false,
                    term: null,
                    fitAddon: null,
                    approval: { pending: false, requestId: null, command: "" },
                    config: {
                        provider: "LM Studio",
                        apiKey: "",
                        model: "local-model",
                    },
                    dirModal: { open: false, path: "" },
                    themeModal: {
                        open: false,
                        tab: "presets",
                        currentHex: "#6366f1",
                        tempHex: "#6366f1",
                        inputHex: "6366F1",
                        rgb: { r: 99, g: 102, b: 241 },
                        presets: [
                            { name: "Indigo", hex: "#6366f1" },
                            { name: "Crimson", hex: "#e11d48" },
                            { name: "Emerald", hex: "#10b981" },
                            { name: "Amber", hex: "#f59e0b" },
                            { name: "Violet", hex: "#8b5cf6" },
                            { name: "Cyan", hex: "#06b6d4" },
                            { name: "Rose", hex: "#f43f5e" },
                            { name: "Lime", hex: "#84cc16" },
                        ],
                    },
                    msgs: [],
                    ws: null,
                    currentId: null,

                    init() {
                        // Init Terminal
                        this.term = new Terminal({
                            cursorBlink: true,
                            fontFamily: "JetBrains Mono, monospace",
                            fontSize: 13,
                            theme: {
                                background: "#000000",
                                foreground: "#e4e4e7",
                            },
                            convertEol: true,
                        });
                        this.fitAddon = new FitAddon.FitAddon();
                        this.term.loadAddon(this.fitAddon);
                        this.term.open(
                            document.getElementById("terminal-container"),
                        );

                        // Handle Input (Keystrokes)
                        this.term.onData((data) => {
                            if (
                                this.ws &&
                                this.ws.readyState === WebSocket.OPEN
                            ) {
                                this.ws.send(
                                    JSON.stringify({
                                        type: "terminal_input",
                                        data: data,
                                    }),
                                );
                            }
                        });

                        // Handle Resize
                        this.term.onResize((size) => {
                            if (
                                this.ws &&
                                this.ws.readyState === WebSocket.OPEN
                            ) {
                                this.ws.send(
                                    JSON.stringify({
                                        type: "terminal_resize",
                                        cols: size.cols,
                                        rows: size.rows,
                                    }),
                                );
                            }
                        });

                        // Visual fit logic
                        window.addEventListener("resize", () =>
                            this.fitAddon.fit(),
                        );
                        this.$watch("terminalOpen", (value) => {
                            if (value) {
                                setTimeout(() => {
                                    this.fitAddon.fit();
                                    this.term.focus();
                                }, 350);
                            }
                        });
                    },

                    connect() {
                        window.chatApp = this;
                        const proto =
                            location.protocol === "https:" ? "wss:" : "ws:";
                        this.ws = new WebSocket(
                            `${proto}//${location.host}/ws`,
                        );
                        this.ws.onmessage = (e) => {
                            this.handle(JSON.parse(e.data));
                        };
                    },

                    toggleTerminal() {
                        this.terminalOpen = !this.terminalOpen;
                    },

                    updateDirectory() {
                        if (!this.dirModal.path) return;
                        this.ws.send(
                            JSON.stringify({
                                type: "update_directory",
                                path: this.dirModal.path,
                            }),
                        );
                        this.dirModal.open = false;
                    },

                    applyTheme(hex) {
                        this.themeModal.currentHex = hex;
                        this.themeModal.tempHex = hex;
                        this.themeModal.inputHex = hex
                            .replace("#", "")
                            .toUpperCase();
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        this.themeModal.rgb = { r, g, b };
                        this.updateCSSVariables(r, g, b);
                    },
                    updateCustomFromPicker(hex) {
                        this.themeModal.inputHex = hex
                            .replace("#", "")
                            .toUpperCase();
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        this.themeModal.rgb = { r, g, b };
                        this.applyTheme(hex);
                    },
                    updateCSSVariables(r, g, b) {
                        document.documentElement.style.setProperty(
                            "--primary-rgb",
                            `${r} ${g} ${b}`,
                        );
                        const hr = Math.max(0, r - 30);
                        const hg = Math.max(0, g - 30);
                        const hb = Math.max(0, b - 30);
                        document.documentElement.style.setProperty(
                            "--primary-hover-rgb",
                            `${hr} ${hg} ${hb}`,
                        );
                    },

                    updateModelDefault() {
                        const defaults = {
                            "LM Studio": "local-model",
                            Ollama: "deepseek-r1",
                            "Google Gemini": "gemini-2.0-flash-exp",
                            OpenAI: "gpt-4o",
                        };
                        if (defaults[this.config.provider])
                            this.config.model = defaults[this.config.provider];
                    },
                    submitConfig() {
                        if (!this.config.provider) return;
                        this.ws.send(
                            JSON.stringify({
                                type: "configure",
                                config: this.config,
                            }),
                        );
                    },
                    send(text) {
                        this.msgs.push({
                            id: Date.now(),
                            role: "user",
                            text: text,
                        });
                        this.ws.send(
                            JSON.stringify({ type: "message", content: text }),
                        );
                        this.scroll();
                    },
                    sendApproval(approved) {
                        if (!this.approval.requestId) return;
                        this.ws.send(
                            JSON.stringify({
                                type: "approval_response",
                                requestId: this.approval.requestId,
                                approved: approved,
                            }),
                        );
                        this.approval.pending = false;
                        this.approval.requestId = null;
                        this.approval.command = "";
                    },
                    triggerReset() {
                        if (this.msgs.length === 0) return;
                        this.msgs.forEach((m) => (m.snapped = true));
                        setTimeout(() => {
                            this.msgs = [];
                            this.submitConfig();
                            this.term.clear();
                        }, 1000);
                    },
                    switchProvider() {
                        this.msgs = [];
                        this.configured = false;
                        this.globalStatus = "";
                    },

                    handle(data) {
                        if (data.type === "request_approval") {
                            this.approval.command = data.command;
                            this.approval.requestId = data.requestId;
                            this.approval.pending = true;
                        } else if (data.type === "status") {
                            const m = this.getCurrent();
                            if (m) m.status = data.text;
                            this.globalStatus = data.text;
                        } else if (data.type === "config_success") {
                            this.configured = true;
                        }
                        // --- TERMINAL HANDLERS ---
                        else if (data.type === "terminal_open") {
                            this.terminalOpen = true;
                        } else if (data.type === "terminal_data") {
                            if (this.term) this.term.write(data.data);
                        } else if (data.type === "start") {
                            this.currentId = Date.now();
                            this.msgs.push({
                                id: this.currentId,
                                role: "assistant",
                                text: "",
                                thought: "",
                                status: "Thinking...",
                                snapped: false,
                            });
                        } else if (data.type === "chunk") {
                            const msg = this.getCurrent();
                            if (!msg) return;
                            let txt = data.content;
                            if (txt.includes("<think>")) {
                                msg.thinking = true;
                                txt = txt.replace("<think>", "");
                            }
                            if (txt.includes("</think>")) {
                                const parts = txt.split("</think>");
                                msg.thought += parts[0];
                                msg.text += parts[1];
                                msg.thinking = false;
                            } else {
                                if (msg.thinking) msg.thought += txt;
                                else msg.text += txt;
                            }
                        }
                        this.scroll();
                    },

                    getCurrent() {
                        return this.msgs.find((m) => m.id === this.currentId);
                    },
                    parse(txt) {
                        return marked.parse(txt || "");
                    },
                    scroll() {
                        this.$nextTick(() => {
                            const b = document.getElementById("chat-box");
                            if (b) {
                                b.scrollTop = b.scrollHeight;
                                hljs.highlightAll();
                            }
                        });
                    },
                };
            }
        </script>
    </body>
</html>
